  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--font-body:'Inter',sans-serif;--font-heading:'Space Grotesk',sans-serif;--bg:#fff;--surface:#f9f9f7;--border:#e5e5e0;--text:#1a1a1a;--muted:#6b6b6b;--accent:#2a5c45;--accent-light:#edf4f0;--accent-hover:#1e4433}

    .xp-photo{margin:.5rem 0} .xp-frame{margin:.6rem 0 0 1.4rem} .xp-frame li{margin:.5rem 0;font-size:1rem} .xp-blank{color:var(--border)}

    .xp-nav{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:1.4rem 0 .4rem} .xp-nav .grow{flex:1}
