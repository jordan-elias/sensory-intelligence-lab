<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book a Session — Sensory Intelligence Lab</title>

  <script src="/dashboard/auth-guard.js" type="module"></script>
  <script src="/assets/js/header.js" defer></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-body: 'Inter', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      --bg: #ffffff;
      --surface: #f9f9f7;
      --border: #e5e5e0;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2a5c45;
      --accent-light: #edf4f0;
      --accent-hover: #1e4433;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 860px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card h2 {
      font-family: var(--font-heading);
      margin-bottom: 0.5rem;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .upgrade {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .btn {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.6rem 1rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>

<body>

<main class="container">
  <div id="booking-root"></div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";
import { getBookingEntitlement } from "/booking/entitlement-logic.js";

const supabase = createClient(
  "https://lrjuufvrgkuvfxcmybtf.supabase.co",
  "sb_publishable_VyiIJOgsGueUOVU_ed49-Q_rS4mi7J1"
);

let entitlement;
let user;

async function init() {
  const { data: { user: authUser } } = await supabase.auth.getUser();

  if (!authUser) {
    window.location.href = "/login";
    return;
  }

  user = authUser;
  entitlement = await getBookingEntitlement(supabase, user.id);

  render();
}

function render() {
  const root = document.getElementById("booking-root");
  root.innerHTML = "";

  // ─────────────────────────────
  // INTRO SESSION
  // ─────────────────────────────
  if (entitlement.canBookIntro) {
    root.innerHTML += `
      <section class="card">
        <h2>Intro Session</h2>
        <div id="my-cal-inline-intro"></div>
        <p class="hint">One-time introductory session</p>
      </section>
    `;
  }

  // ─────────────────────────────
  // SUBSCRIBER SESSION
  // ─────────────────────────────
  if (entitlement.showIncludedSession) {
    root.innerHTML += `
      <section class="card">
        <h2>Your Monthly Session</h2>
        <div id="my-cal-inline-subscriber-session"></div>
        <p class="hint">
          Included in your plan (${entitlement.sessionsRemaining} remaining)
        </p>
      </section>
    `;
  }

  // ─────────────────────────────
  // PAID SESSION
  // ─────────────────────────────
  root.innerHTML += `
    <section class="card">
      <h2>Single Session (€75)</h2>
      <div id="my-cal-inline-session"></div>
      <p class="hint">Book anytime outside your subscription</p>
    </section>
  `;

  // ─────────────────────────────
  // UPGRADE PANEL
  // ─────────────────────────────
  root.innerHTML += `
    <section class="card upgrade">
      <h2>Plan Options</h2>

      ${entitlement.plan === "lab"
        ? `<p>Upgrade to Lab + 1 monthly session (€60)</p>`
        : ""}

      ${entitlement.plan === "call1"
        ? `<p>Upgrade to Lab + 2 monthly sessions (€110)</p>`
        : ""}

      <a class="btn" href="/subscribe">View Plans</a>
    </section>
  `;

  setTimeout(initCal, 0);
}

let calScriptLoaded = false;

function initCal() {
  if (calScriptLoaded) {
    mountAll();
    return;
  }

  const script = document.createElement("script");
  script.src = "https://app.cal.com/embed/embed.js";

  script.onload = () => {
    calScriptLoaded = true;
    mountAll();
  };

  document.body.appendChild(script);
}

function mountAll() {
  const nsIntro = "intro";
  const nsSession = "session";
  const nsSubscriber = "subscriber-session";

  // INIT namespaces
  if (entitlement.canBookIntro) {
    window.Cal("init", nsIntro, { origin: "https://app.cal.com" });
  }

  window.Cal("init", nsSession, { origin: "https://app.cal.com" });

  if (entitlement.showIncludedSession) {
    window.Cal("init", nsSubscriber, { origin: "https://app.cal.com" });
  }

  // INTRO
  if (entitlement.canBookIntro) {
    window.Cal.ns[nsIntro]("inline", {
      elementOrSelector: "#my-cal-inline-intro",
      calLink: "jordan-elias/intro",
      config: { layout: "month_view", useSlotsViewOnSmallScreen: true }
    });

    window.Cal.ns[nsIntro]("ui", { layout: "month_view" });
  }

  // SUBSCRIBER SESSION
  if (entitlement.showIncludedSession) {
    window.Cal.ns[nsSubscriber]("inline", {
      elementOrSelector: "#my-cal-inline-subscriber-session",
      calLink: "jordan-elias/subscriber-session",
      config: { layout: "month_view", useSlotsViewOnSmallScreen: true }
    });

    window.Cal.ns[nsSubscriber]("ui", { layout: "month_view" });
  }

  // PAID SESSION
  window.Cal.ns[nsSession]("inline", {
    elementOrSelector: "#my-cal-inline-session",
    calLink: "jordan-elias/session",
    config: { layout: "month_view", useSlotsViewOnSmallScreen: true }
  });

  window.Cal.ns[nsSession]("ui", { layout: "month_view" });
}

init();
</script>

</body>
</html>
