[[redirects]]
  from = "/dashboard/ear-training"
  to   = "/dashboard/ear-training/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/ear-training/"
  to   = "/dashboard/ear-training/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/spatial-awareness"
  to   = "/dashboard/spatial-awareness/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/spatial-awareness/"
