# ── Catch-all ──
# Handles Supabase auth confirmation redirects.
# MUST remain last.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200


# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'none'; frame-src https://app.cal.com https://www.youtube-nocookie.com; script-src 'self' 'unsafe-inline' https://app.cal.com https://fonts.googleapis.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://app.cal.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://app.cal.com https://cal.com https://lrjuufvrgkuvfxcmybtf.supabase.co https://esm.sh https://lrclib.net; img-src 'self' data: https://app.cal.com https://cal.com https://i.ytimg.com; frame-ancestors 'none';"
# This schedules send-session-reminders to run at the top of every hour.
 
[functions."send-session-reminders"]
  schedule = "0 * * * *"
 

