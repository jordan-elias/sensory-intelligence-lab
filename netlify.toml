# netlify.toml

[build]
  publish = "."

# ── Redirects ──
# Netlify processes these top to bottom and stops at the first match.
# Status 200 = rewrite (serve the file, keep the URL in the browser).

# Root — sign in / sign up page
[[redirects]]
  from = "/"
  to   = "/index.html"
  status = 200

# Dashboard
[[redirects]]
  from = "/dashboard"
  to   = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to   = "/dashboard/index.html"
  status = 200

