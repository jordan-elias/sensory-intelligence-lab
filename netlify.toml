# ── Other pages ──

[[redirects]]
  from = "/subscribe"
  to   = "/subscribe.html"
  status = 200

[[redirects]]
  from = "/subscribe/"
  to   = "/subscribe.html"
  status = 200

# ── Catch-all ──
# Handles Supabase auth confirmation redirects that may land on
# unexpected paths. The root index.html checks for a session and
# forwards to /dashboard/ if one exists.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
