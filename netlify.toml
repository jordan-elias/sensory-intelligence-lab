# ── Catch-all ──
# Handles Supabase auth confirmation redirects.
# MUST remain last.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
