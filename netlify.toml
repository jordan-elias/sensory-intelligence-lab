# ── Catch-all ──
# Handles Supabase auth confirmation redirects.
# MUST remain last.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200


Content-Security-Policy = """
  frame-ancestors 'none';
  frame-src
    https://app.cal.com
    https://www.youtube.com
    https://youtube.com
    https://www.youtube-nocookie.com;
  script-src
    'self'
    'unsafe-inline'
    'unsafe-eval'
    https://app.cal.com
    https://cdnjs.cloudflare.com
    https://cdn.jsdelivr.net
    https://www.youtube.com;
  style-src
    'self'
    'unsafe-inline'
    https://app.cal.com;
  font-src
    'self';
  connect-src
    'self'
    https://app.cal.com
    https://cal.com
    https://lrjuufvrgkuvfxcmybtf.supabase.co
    https://lrclib.net
    https://www.youtube.com
    https://www.youtube-nocookie.com;
  img-src
    'self'
    data:
    https://app.cal.com
    https://cal.com
    https://i.ytimg.com
    https://img.youtube.com;
  media-src
    'self'
    blob:
    data:
    https://www.youtube.com;
  worker-src
    'self'
    blob:;
"""

    
# This schedules send-session-reminders to run at the top of every hour.
 
[functions."send-session-reminders"]
  schedule = "0 * * * *"
 

