# netlify.toml

[build]
  publish = "."

# ── Redirects ──
# Netlify processes these top to bottom and stops at the first match.
# Status 200 means "rewrite" (serve the file but keep the URL).
# Status 301 means "redirect" (change the URL in the browser).

# Redirect root domain to index.html explicitly
[[redirects]]
  from = "/"
  to   = "/index.html"
  status = 200

# Dashboard folder
[[redirects]]
  from = "/dashboard"
  to   = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to   = "/dashboard/index.html"
  status = 200

# Module pages — add one block per module folder
# Adjust these names to match your exact folder names in /dashboard/

[[redirects]]
  from = "/dashboard/regulation"
  to   = "/dashboard/regulation/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/regulation/"
  to   = "/dashboard/regulation/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/breath-regulation"
  to   = "/dashboard/breath-regulation/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/breath-regulation/"
  to   = "/dashboard/breath-regulation/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/rhythmic-entrainment"
  to   = "/dashboard/rhythmic-entrainment/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/rhythmic-entrainment/"
