  status = 200

[[redirects]]
  from = "/dashboard/auditory-scene-analysis/"
  to   = "/dashboard/auditory-scene-analysis/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/check-in"
  to   = "/dashboard/check-in/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/check-in/"
  to   = "/dashboard/check-in/index.html"
  status = 200

# Subscribe page
[[redirects]]
  from = "/subscribe"
  to   = "/subscribe.html"
  status = 200

[[redirects]]
  from = "/subscribe/"
  to   = "/subscribe.html"
  status = 200

# Catch-all — send any unmatched path to index.html
# This handles Supabase auth callback redirects that may land
# on unexpected paths. Client-side JS then checks auth and redirects.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
