<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensory Intelligence Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --font-body:'Inter',sans-serif;
      --font-heading:'Space Grotesk',sans-serif;
      --bg:#fff;--surface:#f9f9f7;--border:#e5e5e0;
      --text:#1a1a1a;--muted:#6b6b6b;
      --accent:#2a5c45;--accent-light:#edf4f0;--accent-hover:#1e4433;
      --error:#c0392b;--success:#2a5c45;
    }
    html{font-size:16px}
    body{font-family:var(--font-body);color:var(--text);background:var(--bg);
      min-height:100vh;display:flex;flex-direction:column;}

    header{border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;
      display:flex;align-items:center;}
    header h1{font-family:var(--font-heading);font-size:1rem;font-weight:600;letter-spacing:-0.01em}

    .page{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}

    .card{width:100%;max-width:400px}
    .card-header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
    .card-header h2{font-family:var(--font-heading);font-size:1.5rem;font-weight:600;
      letter-spacing:-.02em;margin-bottom:.3rem}
    .card-header p{font-size:.875rem;color:var(--muted)}

    /* Tab switcher */
    .tabs{display:flex;gap:0;margin-bottom:1.75rem;border:1px solid var(--border)}
    .tab{flex:1;font-family:var(--font-heading);font-size:.8rem;font-weight:600;
      padding:.6rem 1rem;border:none;background:var(--bg);color:var(--muted);
      cursor:pointer;transition:all .12s;letter-spacing:.02em}
    .tab.active{background:var(--accent);color:white}

    /* Form */
    .form-group{margin-bottom:1rem}
    label{display:block;font-size:.8rem;font-weight:500;color:var(--text);margin-bottom:.35rem}
    input[type="email"],input[type="password"]{
      width:100%;padding:.65rem .9rem;border:1px solid var(--border);
      background:var(--bg);color:var(--text);font-family:var(--font-body);
      font-size:.9rem;outline:none;transition:border-color .12s;
    }
    input:focus{border-color:var(--accent)}

    .btn{width:100%;font-family:var(--font-heading);font-size:.875rem;font-weight:600;
      padding:.8rem;border:none;background:var(--accent);color:white;
      cursor:pointer;transition:background .15s;letter-spacing:-.01em;margin-top:.5rem}
    .btn:hover{background:var(--accent-hover)}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    /* Messages */
    .msg{padding:.75rem 1rem;font-size:.8rem;line-height:1.5;margin-bottom:1rem;display:none}
    .msg.error{background:#fdf2f2;border-left:3px solid var(--error);color:var(--error)}
    .msg.success{background:var(--accent-light);border-left:3px solid var(--accent);color:var(--accent)}
    .msg.show{display:block}

    /* Panel visibility */
    .panel{display:none}
    .panel.active{display:block}

    /* Confirmation screen */
    .confirm-screen{text-align:center;padding:2rem 0}
    .confirm-icon{font-size:2.5rem;margin-bottom:1rem}
    .confirm-screen h3{font-family:var(--font-heading);font-size:1.1rem;font-weight:600;margin-bottom:.5rem}
    .confirm-screen p{font-size:.875rem;color:var(--muted);line-height:1.6}
    .confirm-screen .email-shown{font-weight:600;color:var(--text)}

    footer{border-top:1px solid var(--border);padding:1.25rem 2rem;
      text-align:center;font-size:.8rem;color:var(--muted)}
    footer a{color:var(--muted);text-decoration:none}
    footer a:hover{color:var(--accent)}
  </style>
</head>
<body>

<header>
  <h1>Sensory Intelligence Lab</h1>
</header>

<div class="page">
  <div class="card">

    <div class="card-header">
      <h2>Welcome</h2>
      <p>Sign in to access your training modules.</p>
    </div>

    <!-- Auth tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('signin')">Sign in</button>
      <button class="tab" onclick="switchTab('signup')">Create account</button>
    </div>

    <!-- Sign in panel -->
    <div class="panel active" id="signinPanel">
      <div class="msg" id="signinMsg"></div>

      <div class="form-group">
        <label for="signinEmail">Email</label>
        <input type="email" id="signinEmail" placeholder="you@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signinPassword">Password</label>
        <input type="password" id="signinPassword" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="btn" id="signinBtn" onclick="handleSignIn()">Sign in</button>
    </div>

    <!-- Sign up panel -->
    <div class="panel" id="signupPanel">
      <div class="msg" id="signupMsg"></div>

      <!-- Signup form (shown first) -->
      <div id="signupForm">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Choose a password (8+ characters)" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="signupPasswordConfirm">Confirm password</label>
          <input type="password" id="signupPasswordConfirm" placeholder="Repeat your password" autocomplete="new-password">
        </div>
        <button class="btn" id="signupBtn" onclick="handleSignUp()">Create account</button>
      </div>

      <!-- Confirmation notice (shown after signup) -->
      <div id="signupConfirm" class="confirm-screen" style="display:none">
        <div class="confirm-icon">✉️</div>
        <h3>Check your email</h3>
        <p>We've sent a confirmation link to<br>
          <span class="email-shown" id="confirmedEmail"></span>
        </p>
        <p style="margin-top:.75rem">Click the link to verify your account, then come back here to sign in.</p>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>Jordan Elias Music Therapy · Berlin · <a href="/contact/">Contact</a></p>
</footer>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL      = "https://lrjuufvrgkuvfxcmybtf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_VyiIJOgsGueUOVU_ed49-Q_rS4mi7J1";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── If user is already signed in, send them to dashboard ──
  // This handles the case where someone navigates back to / while logged in,
  // AND handles the email confirmation redirect (Supabase redirects back to
  // Site URL after confirmation, which is /, so we check for a session here).
  const { data: { user } } = await supabase.auth.getUser();
  if (user) {
    window.location.replace("/dashboard/");
  }

  // ── Tab switching ──
  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('active', (i===0 && tab==='signin') || (i===1 && tab==='signup'));
    });
    document.getElementById('signinPanel').classList.toggle('active', tab==='signin');
    document.getElementById('signupPanel').classList.toggle('active', tab==='signup');
  };

  // ── Helpers ──
  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `msg ${type} show`;
  }
  function clearMsg(id) {
    const el = document.getElementById(id);
    el.className = 'msg';
  }
  function setLoading(btnId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(btnId).textContent = loading
      ? 'Please wait…'
      : btnId === 'signinBtn' ? 'Sign in' : 'Create account';
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const signinActive = document.getElementById('signinPanel').classList.contains('active');
    if (signinActive) handleSignIn();
    else handleSignUp();
  });

  // ── Sign in ──
  window.handleSignIn = async function() {
    clearMsg('signinMsg');
    const email    = document.getElementById('signinEmail').value.trim();
    const password = document.getElementById('signinPassword').value;

    if (!email || !password) {
      showMsg('signinMsg', 'Please enter your email and password.', 'error'); return;
    }

    setLoading('signinBtn', true);
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    setLoading('signinBtn', false);

    if (error) {
      // Supabase returns a generic message for security — we surface a friendly one
      if (error.message.includes('Email not confirmed')) {
        showMsg('signinMsg', 'Please confirm your email address first. Check your inbox.', 'error');
      } else {
        showMsg('signinMsg', 'Incorrect email or password. Please try again.', 'error');
      }
      return;
    }

    // Success — redirect to dashboard
    window.location.replace("/dashboard/");
  };

  // ── Sign up ──
  window.handleSignUp = async function() {
    clearMsg('signupMsg');
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm  = document.getElementById('signupPasswordConfirm').value;

    if (!email || !password || !confirm) {
      showMsg('signupMsg', 'Please fill in all fields.', 'error'); return;
    }
    if (password.length < 8) {
      showMsg('signupMsg', 'Password must be at least 8 characters.', 'error'); return;
    }
    if (password !== confirm) {
      showMsg('signupMsg', 'Passwords do not match.', 'error'); return;
    }

    setLoading('signupBtn', true);
    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        // After email confirmation, Supabase redirects to Site URL (/)
        // which then checks for a session and forwards to /dashboard/
        emailRedirectTo: "https://lab.jordanelias.de/",
      }
    });
    setLoading('signupBtn', false);

    if (error) {
      showMsg('signupMsg', error.message, 'error'); return;
    }

    // Show confirmation notice
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('confirmedEmail').textContent = email;
    document.getElementById('signupConfirm').style.display = 'block';
  };
</script>
</body>
</html>
